name: videotool
description: "Flutter + FFmpegKit video tool starter with Burmese UI."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  ffmpeg_kit_flutter_full: 6.0.3
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  permission_handler: ^13.0.0
  share_plus: ^13.0.0
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/models/cb.rnnn
    - assets/models/NOTICE.txt
